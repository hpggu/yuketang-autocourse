name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = 'dev' }

          $stage = "package/YuketangAutoCourse-$ver"
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item 'src/AutoCourse.ps1' $stage
          Get-ChildItem -LiteralPath 'src' -Filter '*.cmd' -File | Copy-Item -Destination $stage
          Copy-Item 'docs/USAGE.md', 'README.md', 'LICENSE', 'CHANGELOG.md' $stage

          $zip = "YuketangAutoCourse-$ver.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: YuketangAutoCourse-*.zip
          generate_release_notes: true
          body: |
            下载 `YuketangAutoCourse-*.zip`，解压后双击 `启动刷课.cmd` 即可。

            使用前请先读 README 与 docs/USAGE.md。