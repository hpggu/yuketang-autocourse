name: Bug 报告
description: 脚本不工作、点错、卡住、报错
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        本项目所有故障几乎都来自「类名 / 坐标取不到」，所以下面三项信息缺一不可，否则无法定位。

  - type: input
    id: script-version
    attributes:
      label: 脚本版本
      description: 见 CHANGELOG.md，或启动日志第一行
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 浏览器与版本 + 系统 + 显示缩放比例
      placeholder: "Edge 131 / Windows 11 24H2 / 缩放 125%"
    validations:
      required: true

  - type: input
    id: site
    attributes:
      label: 雨课堂域名
      description: changjiang.yuketang.cn / www.yuketang.cn / 学校自建
      placeholder: "changjiang.yuketang.cn"
    validations:
      required: true

  - type: textarea
    id: once-output
    attributes:
      label: -Once 的输出
      description: 运行 `powershell -ExecutionPolicy Bypass -File .\src\AutoCourse.ps1 -Once` 后贴完整输出
      render: text
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志尾部
      description: logs/autocourse-*.log 的最后 100 行
      render: text
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 期望行为 vs 实际行为
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有在运行期间最小化浏览器窗口
          required: true
        - label: 我只有一个 Edge 窗口开着雨课堂
          required: true
